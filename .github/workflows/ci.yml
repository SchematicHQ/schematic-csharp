name: ci

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  # Authenticates `gh release download` in scripts/download-wasm.sh; the rules engine
  # WASM lives in the private SchematicHQ/schematic-api repo, so the default
  # GITHUB_TOKEN (scoped to this repo) cannot read it. Requires a GH_TOKEN repo
  # secret with read access to schematic-api releases.
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Download WASM binary
        run: ./scripts/download-wasm.sh

      - name: Install tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore src/SchematicHQ.Client/SchematicHQ.Client.csproj

      - name: Build
        run: dotnet build src/SchematicHQ.Client/SchematicHQ.Client.csproj --no-restore -c Release

      - name: Restore test dependencies
        run: dotnet restore src/SchematicHQ.Client.Test/SchematicHQ.Client.Test.csproj

      - name: Build tests
        run: dotnet build src/SchematicHQ.Client.Test/SchematicHQ.Client.Test.csproj --no-restore -c Release

      - name: Test
        run: dotnet test src/SchematicHQ.Client.Test/SchematicHQ.Client.Test.csproj --no-restore --no-build -c Release

      - name: Pack
        if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        run: dotnet pack src/SchematicHQ.Client/SchematicHQ.Client.csproj --no-build --no-restore -c Release

      # Trusted publishing: exchanges the job's GitHub OIDC token for a short-lived
      # NuGet API key. The policy lives under the "schematic" profile on nuget.org
      # and is bound to this repo and workflow file.
      - name: NuGet login
        if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        run: dotnet nuget push src/SchematicHQ.Client/bin/Release/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source "nuget.org"
